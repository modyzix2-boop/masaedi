name: build-native-apk
on: [workflow_dispatch]
concurrency: {group: native-apk-build, cancel-in-progress: true}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: scaffold android project (keeps existing lib/)
        run: |
          cd flutter_app
          flutter create --platforms android --org com.modyzix --project-name masaedi_ai .
      - name: patch manifest (label + internet permission)
        run: |
          cd flutter_app
          sed -i 's/android:label="masaedi_ai"/android:label="مساعدي"/' android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' android/app/src/main/AndroidManifest.xml
          grep -n "android:label\|INTERNET" android/app/src/main/AndroidManifest.xml
      - name: add markdown package (latest compatible)
        run: |
          cd flutter_app
          flutter pub add flutter_markdown_plus
      - name: build release apk
        run: |
          cd flutter_app
          flutter pub get
          flutter build apk --release --split-per-abi
      - run: cp flutter_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk masaedi-native-v1.3.0.apk
      - uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: native-v1.3.0
          name: "مساعدي ناتيف v1.3.0"
          files: masaedi-native-v1.3.0.apk
